<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #123c2d">
    <h1>Confirm your registration</h1>
    <p>Hello {{name}},</p>
    <p>
      Thank you for registering with My Hike. Confirm your email address before
      logging in.
    </p>
    <p><a href="{{confirmationUrl}}">Confirm email address</a></p>
    <p>
      This link expires in {{expiryHours}} hours. If you did not register, you
      can ignore this message.
    </p>
  </body>
</html>
