<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #123c2d">
    <h1>Reset your password</h1>
    <p>Hello {{name}},</p>
    <p>We received a request to reset your My Hike password.</p>
    <p><a href="{{resetUrl}}">Reset password</a></p>
    <p>
      This link expires in {{expiryMinutes}} minutes. If you did not request
      this, you can ignore this email.
    </p>
  </body>
</html>
