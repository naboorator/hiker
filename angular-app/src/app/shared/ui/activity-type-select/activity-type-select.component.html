<div class="activity-type">
  <span class="activity-label">{{ 'hikeForm.activityType' | transloco }}</span>
  <details class="activity-select" #activityMenu>
    <summary>
      <span
        class="activity-icon"
        [class.hiking]="value() === 'hiking'"
        [class.fitness]="value() === 'fitness'"
        aria-hidden="true"
      >
        @if (value() === 'hiking') {
          <svg viewBox="0 0 32 32">
            <circle class="sun" cx="23" cy="9" r="5" />
            <path class="mountain-back" d="M2 25 11 12l5 7 5-9 9 15Z" />
            <path class="mountain-front" d="M1 27 10 18l5 6 5-5 11 8Z" />
            <path class="trail" d="M13 27c1-4 7-4 6-9" />
          </svg>
        } @else {
          <svg viewBox="0 0 32 32">
            <path class="bar" d="M7 16h18" />
            <path class="weight outer" d="M5 10v12M27 10v12" />
            <path class="weight inner" d="M9 7v18M23 7v18" />
          </svg>
        }
      </span>
      <strong>{{
        (value() === 'hiking' ? 'hikeForm.hiking' : 'hikeForm.fitness') | transloco
      }}</strong>
      <span class="chevron" aria-hidden="true">⌄</span>
    </summary>
    <div class="activity-options" role="listbox">
      <button
        type="button"
        role="option"
        [attr.aria-selected]="value() === 'hiking'"
        (click)="valueChange.emit('hiking'); activityMenu.open = false"
      >
        <span class="activity-icon hiking" aria-hidden="true"
          ><svg viewBox="0 0 32 32">
            <circle class="sun" cx="23" cy="9" r="5" />
            <path class="mountain-back" d="M2 25 11 12l5 7 5-9 9 15Z" />
            <path class="mountain-front" d="M1 27 10 18l5 6 5-5 11 8Z" />
            <path class="trail" d="M13 27c1-4 7-4 6-9" /></svg
        ></span>
        <span>{{ 'hikeForm.hiking' | transloco }}</span>
      </button>
      <button
        type="button"
        role="option"
        [attr.aria-selected]="value() === 'fitness'"
        (click)="valueChange.emit('fitness'); activityMenu.open = false"
      >
        <span class="activity-icon fitness" aria-hidden="true"
          ><svg viewBox="0 0 32 32">
            <path class="bar" d="M7 16h18" />
            <path class="weight outer" d="M5 10v12M27 10v12" />
            <path class="weight inner" d="M9 7v18M23 7v18" /></svg
        ></span>
        <span>{{ 'hikeForm.fitness' | transloco }}</span>
      </button>
    </div>
  </details>
</div>
