<main>
  <app-header [appName]="store.settings().appName" [subtitle]="'activities.subtitle' | transloco" />
  @if (store.hikes().length) {
    <div class="page-actions">
      <button type="button" (click)="adding.set(true)">
        {{ 'activities.addActivity' | transloco }}
      </button>
    </div>
  }
  @if (!store.loading() && !store.hikes().length) {
    <section class="empty-state">
      <p>{{ 'activities.empty' | transloco }}</p>
      <button type="button" (click)="adding.set(true)">
        {{ 'activities.addActivity' | transloco }}
      </button>
    </section>
  }
  @for (month of months(); track month.key) {
    <app-activity-month-list
      [title]="month.title"
      [days]="month.days"
      [minutes]="month.minutes"
      [metres]="month.metres"
      [allowEdits]="true"
      (remove)="pendingDelete.set($event)"
      (edit)="selected.set($event)"
    />
  }
  @if (adding()) {
    <app-modal-dialog
      [title]="'activities.addTitle' | transloco"
      [closeLabel]="'common.close' | transloco"
      dialogRole="dialog"
      width="520px"
      [showCloseButton]="true"
      [closeOnBackdrop]="true"
      [closeOnEscape]="true"
      (closed)="adding.set(false)"
    >
      <app-hike-form
        [ownerName]="store.settings().ownerName"
        [hikeNames]="names()"
        [defaultHikingName]="store.lastHikingName()"
        [peopleSuggestions]="store.people()"
        [defaultActivityType]="store.lastActivityType()"
        [buttonText]="'activities.addActivity' | transloco"
        (saved)="add($event)"
        (cancelled)="adding.set(false)"
      />
    </app-modal-dialog>
  }
  @if (selected(); as hike) {
    <app-modal-dialog
      [title]="'activities.editTitle' | transloco"
      [closeLabel]="'common.close' | transloco"
      dialogRole="dialog"
      width="520px"
      [showCloseButton]="true"
      [closeOnBackdrop]="true"
      [closeOnEscape]="true"
      (closed)="selected.set(null)"
    >
      <app-hike-form
        [ownerName]="store.settings().ownerName"
        [hikeNames]="names()"
        [defaultHikingName]="store.lastHikingName()"
        [peopleSuggestions]="store.people()"
        [draft]="draft(hike)"
        [buttonText]="'common.save' | transloco"
        (saved)="save(hike.id, $event)"
        (cancelled)="selected.set(null)"
      />
    </app-modal-dialog>
  }
  @if (pendingDelete()) {
    <app-modal-dialog
      [title]="'activities.deleteTitle' | transloco"
      [closeLabel]="'common.close' | transloco"
      dialogRole="alertdialog"
      width="420px"
      [showCloseButton]="true"
      [closeOnBackdrop]="true"
      [closeOnEscape]="true"
      (closed)="pendingDelete.set(null)"
    >
      <p>{{ 'activities.deleteConfirmation' | transloco }}</p>
      <div class="actions">
        <button (click)="pendingDelete.set(null)">{{ 'common.cancel' | transloco }}</button
        ><button class="danger" (click)="confirmDelete()">
          {{ 'common.delete' | transloco }}
        </button>
      </div>
    </app-modal-dialog>
  }
</main>
