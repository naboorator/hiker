<main>
  <app-header
    [appName]="hikeStore.settings().appName"
    [subtitle]="'friends.activityTitle' | transloco"
  />
  @if (!store.loading() && !activities().length) {
    <section>
      <p class="empty">{{ 'friends.noActivities' | transloco }}</p>
    </section>
  }
  @for (month of months(); track month.key) {
    <app-activity-month-list
      [title]="month.title"
      [days]="month.days"
      [minutes]="month.minutes"
      [metres]="month.metres"
      [showFriendReactions]="true"
      [detailsEnabled]="true"
      (like)="toggleLike($event)"
      (slap)="giveSlap($event)"
    />
  }
  @if (slapVisible()) {
    <div class="slap-overlay" role="status" [attr.aria-label]="'friends.slapSent' | transloco">
      <img src="friend-slap.png" alt="" />
    </div>
  }
</main>
