<div class="activity-type">
  <span class="activity-label">{{ 'hikeForm.activityType' | transloco }}</span>
  <details class="activity-select" #activityMenu>
    <summary>
      <app-activity-type-icon [type]="selectedOption().type" />
      <strong>{{ selectedOption().translationKey | transloco }}</strong>
      <span class="chevron" aria-hidden="true">⌄</span>
    </summary>
    <div class="activity-options" role="listbox">
      @for (option of options; track option.type) {
        <button
          type="button"
          role="option"
          [attr.aria-selected]="value() === option.type"
          (click)="valueChange.emit(option.type); activityMenu.open = false"
        >
          <app-activity-type-icon [type]="option.type" />
          <span>{{ option.translationKey | transloco }}</span>
        </button>
      }
    </div>
  </details>
</div>
