name: Deploy develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            angular-app/package-lock.json
            api/package-lock.json

      - name: Install frontend dependencies
        working-directory: angular-app
        run: npm ci

      - name: Verify frontend
        working-directory: angular-app
        run: |
          npm run format:check
          npm run lint
          npm run test:ci

      - name: Configure frontend production environment
        working-directory: angular-app
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          : "${MAPBOX_ACCESS_TOKEN:?Missing GitHub Actions secret: MAPBOX_ACCESS_TOKEN}"
          node -e "const fs = require('node:fs'); const path = 'src/environments/environment.production.ts'; const placeholder = '__MAPBOX_ACCESS_TOKEN__'; const source = fs.readFileSync(path, 'utf8'); if (!source.includes(placeholder)) throw new Error('Mapbox token placeholder is missing'); fs.writeFileSync(path, source.replace(placeholder, process.env.MAPBOX_ACCESS_TOKEN));"

      - name: Build frontend
        working-directory: angular-app
        run: npx ng build --configuration production

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Verify and build API
        working-directory: api
        run: |
          npm run typecheck
          npm run build:zip

      - name: Validate deployment configuration
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          REMOTE_NODE_ACTIVATE: ${{ secrets.REMOTE_NODE_ACTIVATE }}
        run: |
          : "${DEPLOY_HOST:?Missing GitHub Actions secret: DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing GitHub Actions secret: DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing GitHub Actions secret: DEPLOY_SSH_KEY}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing GitHub Actions secret: DEPLOY_SSH_KNOWN_HOSTS}"
          : "${FRONTEND_PATH:?Missing GitHub Actions secret: FRONTEND_PATH}"
          : "${API_PATH:?Missing GitHub Actions secret: API_PATH}"
          : "${REMOTE_NODE_ACTIVATE:?Missing GitHub Actions secret: REMOTE_NODE_ACTIVATE}"

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directories
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$FRONTEND_PATH' '$API_PATH'"

      - name: Deploy frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          rsync -az --info=progress2 --timeout=60 -e "ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" angular-app/dist/angular-app/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_PATH/"

      - name: Deploy API
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_NODE_ACTIVATE: ${{ secrets.REMOTE_NODE_ACTIVATE }}
        run: |
          rsync -az --info=progress2 --timeout=60 -e "ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" api/dist api/package.json api/package-lock.json "$DEPLOY_USER@$DEPLOY_HOST:$API_PATH/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" "test -r '$REMOTE_NODE_ACTIVATE' || { echo 'REMOTE_NODE_ACTIVATE does not point to a readable activation script'; exit 1; }; . '$REMOTE_NODE_ACTIVATE' && node --version && npm --version && cd '$API_PATH' && timeout 300 npm ci --omit=dev --no-audit --no-fund --prefer-offline && mkdir -p tmp && touch tmp/restart.txt"
