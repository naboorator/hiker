@if (store.error(); as error) {
  <div class="api-notification request-error" role="alert">
    <span aria-hidden="true">!</span>
    <p>{{ error | transloco }}</p>
  </div>
}
<router-outlet />
<footer [attr.aria-label]="'common.language' | transloco">
  <button
    type="button"
    [class.active]="activeLanguage() === 'si'"
    [attr.aria-pressed]="activeLanguage() === 'si'"
    (click)="changeLanguage('si')"
  >
    si
  </button>
  <span aria-hidden="true">|</span>
  <button
    type="button"
    [class.active]="activeLanguage() === 'en'"
    [attr.aria-pressed]="activeLanguage() === 'en'"
    (click)="changeLanguage('en')"
  >
    en
  </button>
</footer>
