name: Deploy develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            angular-app/package-lock.json
            api/package-lock.json

      - name: Install frontend dependencies
        working-directory: angular-app
        run: npm ci

      - name: Verify frontend
        working-directory: angular-app
        run: |
          npm run format:check
          npm run lint
          npm run test:ci

      - name: Build frontend
        working-directory: angular-app
        run: npx ng build --configuration production

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Verify and build API
        working-directory: api
        run: |
          npm run typecheck
          npm run build:zip

      - name: Validate deployment configuration
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          REMOTE_NODE_BIN: ${{ secrets.REMOTE_NODE_BIN }}
        run: |
          : "${DEPLOY_HOST:?Missing GitHub Actions secret: DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing GitHub Actions secret: DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing GitHub Actions secret: DEPLOY_SSH_KEY}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing GitHub Actions secret: DEPLOY_SSH_KNOWN_HOSTS}"
          : "${FRONTEND_PATH:?Missing GitHub Actions secret: FRONTEND_PATH}"
          : "${API_PATH:?Missing GitHub Actions secret: API_PATH}"
          : "${REMOTE_NODE_BIN:?Missing GitHub Actions secret: REMOTE_NODE_BIN}"

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directories
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$FRONTEND_PATH' '$API_PATH'"

      - name: Deploy frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          rsync -az --info=progress2 --timeout=60 -e "ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" angular-app/dist/angular-app/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_PATH/"

      - name: Deploy API
        env:
          API_PATH: ${{ secrets.API_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_NODE_BIN: ${{ secrets.REMOTE_NODE_BIN }}
        run: |
          rsync -az --info=progress2 --timeout=60 -e "ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" api/dist api/package.json api/package-lock.json api/migrations api/openapi.yaml api/.env.example "$DEPLOY_USER@$DEPLOY_HOST:$API_PATH/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" "test -x '$REMOTE_NODE_BIN/node' || { echo 'REMOTE_NODE_BIN does not contain an executable node file'; exit 1; }; test -x '$REMOTE_NODE_BIN/npm' || { echo 'REMOTE_NODE_BIN does not contain an executable npm file'; exit 1; }; export PATH='$REMOTE_NODE_BIN':\$PATH; '$REMOTE_NODE_BIN/node' --version; '$REMOTE_NODE_BIN/npm' --version; cd '$API_PATH' && timeout 300 '$REMOTE_NODE_BIN/npm' ci --omit=dev --no-audit --no-fund --prefer-offline && mkdir -p tmp && touch tmp/restart.txt"
